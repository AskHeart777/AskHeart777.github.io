<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bohan Fang</title>
  <meta name="description" content="Bohan Fang — Undergraduate at the University of Washington, Paul G. Allen School of Computer Science & Engineering.">
  <link rel="icon" href="https://github.com/AskHeart777.png?size=64">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --fg: #f5f5f5;
      --muted: #9a9a9a;
      --line: rgba(255, 255, 255, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--fg); }
    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ---------- Magnetic field background ---------- */
    #field {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
    }

    /* ---------- Content ---------- */
    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      pointer-events: none; /* let the cursor keep driving the field */
    }
    .card {
      pointer-events: auto;
      text-align: center;
      max-width: 560px;
      padding: 40px 32px;
      border-radius: 24px;
      background: radial-gradient(closest-side, rgba(0,0,0,0.92), rgba(0,0,0,0.75) 70%, rgba(0,0,0,0) 100%);
    }
    .avatar {
      width: 148px;
      height: 148px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--line);
      box-shadow: 0 0 0 6px rgba(255,255,255,0.04), 0 0 60px rgba(255,255,255,0.08);
      display: block;
      margin: 0 auto 28px;
      background: #111;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 2.8rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .tagline {
      margin-top: 12px;
      color: var(--muted);
      font-size: 1.05rem;
      font-weight: 300;
    }
    .meta {
      margin-top: 6px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.8rem;
      color: #6f6f6f;
      letter-spacing: 0.04em;
    }
    .links {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--fg);
      text-decoration: none;
      font-size: 0.9rem;
      transition: background .2s, border-color .2s;
    }
    .links a:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.4); }
    .links svg { width: 16px; height: 16px; fill: currentColor; }

    @media (prefers-reduced-motion: reduce) {
      .links a { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>

  <main>
    <section class="card">
      <img class="avatar" src="https://github.com/AskHeart777.png?size=400" alt="Bohan Fang">
      <h1>Bohan Fang</h1>
      <p class="tagline">Undergraduate @ UW Computer Science &amp; Engineering</p>
      <p class="meta">SEATTLE, WA</p>
      <nav class="links">
        <a href="https://github.com/AskHeart777" target="_blank" rel="noopener">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          GitHub
        </a>
      </nav>
    </section>
  </main>

  <script>
  (() => {
    const canvas = document.getElementById('field');
    const ctx = canvas.getContext('2d');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Field settings
    const SPACING = 34;      // px between arrow centers
    const ARROW_LEN = 13;    // base arrow length
    const EASE = reduceMotion ? 1 : 0.12;      // how quickly arrows turn toward the target

    let W = 0, H = 0, dpr = 1;
    let arrows = [];

    // Target point the arrows are "attracted" to
    const target = { x: 0, y: 0 };
    const pointer = { x: 0, y: 0, active: false, lastMove: 0 };

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const cols = Math.ceil(W / SPACING) + 1;
      const rows = Math.ceil(H / SPACING) + 1;
      const offX = (W - (cols - 1) * SPACING) / 2;
      const offY = (H - (rows - 1) * SPACING) / 2;
      const prev = arrows;
      arrows = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          arrows.push({ x: offX + c * SPACING, y: offY + r * SPACING, a: prev.length ? 0 : Math.random() * Math.PI * 2 });
        }
      }
      if (!pointer.active) { target.x = W / 2; target.y = H / 2; }
    }

    function onMove(x, y) {
      pointer.x = x; pointer.y = y;
      pointer.active = true;
      pointer.lastMove = performance.now();
    }
    window.addEventListener('pointermove', e => onMove(e.clientX, e.clientY), { passive: true });
    window.addEventListener('touchmove', e => {
      const t = e.touches[0]; if (t) onMove(t.clientX, t.clientY);
    }, { passive: true });
    document.addEventListener('pointerleave', () => { pointer.active = false; });
    window.addEventListener('resize', resize);

    // Shortest signed angular difference
    function angleDiff(from, to) {
      let d = (to - from) % (Math.PI * 2);
      if (d > Math.PI) d -= Math.PI * 2;
      if (d < -Math.PI) d += Math.PI * 2;
      return d;
    }

    function drawArrow(x, y, angle, len, alpha) {
      const cos = Math.cos(angle), sin = Math.sin(angle);
      const half = len / 2;
      const tx = x + cos * half, ty = y + sin * half;   // tip
      const bx = x - cos * half, by = y - sin * half;   // tail
      const head = Math.max(3, len * 0.38);
      const spread = 0.5;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.lineTo(tx, ty);
      ctx.moveTo(tx - Math.cos(angle - spread) * head, ty - Math.sin(angle - spread) * head);
      ctx.lineTo(tx, ty);
      ctx.lineTo(tx - Math.cos(angle + spread) * head, ty - Math.sin(angle + spread) * head);
      ctx.stroke();
    }

    function frame(t) {
      // When idle, the "magnet" drifts on a slow Lissajous path
      const idle = !pointer.active || (t - pointer.lastMove > 4000);
      let gx, gy;
      if (idle) {
        gx = W / 2 + Math.cos(t * 0.00031) * W * 0.32;
        gy = H / 2 + Math.sin(t * 0.00047) * H * 0.30;
      } else {
        gx = pointer.x; gy = pointer.y;
      }
      const follow = idle ? 0.02 : 0.25;
      target.x += (gx - target.x) * follow;
      target.y += (gy - target.y) * follow;

      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const maxD = Math.hypot(W, H);
      for (const p of arrows) {
        const dx = target.x - p.x, dy = target.y - p.y;
        const desired = Math.atan2(dy, dx);
        p.a += angleDiff(p.a, desired) * EASE;

        // Arrows near the magnet are longer & brighter, fading with distance
        const d = Math.hypot(dx, dy);
        const k = 1 - Math.min(d / (maxD * 0.6), 1);
        const len = ARROW_LEN * (0.55 + 0.75 * k * k);
        const alpha = 0.18 + 0.72 * k * k;
        drawArrow(p.x, p.y, p.a, len, alpha);
      }
      ctx.globalAlpha = 1;
      if (!reduceMotion) requestAnimationFrame(frame);
    }

    resize();
    if (reduceMotion) {
      // Static field pointing to center; still react to pointer
      arrows.forEach(p => p.a = Math.atan2(H / 2 - p.y, W / 2 - p.x));
      frame(0);
      window.addEventListener('pointermove', () => requestAnimationFrame(frame), { passive: true });
    } else {
      requestAnimationFrame(frame);
    }
  })();
  </script>
</body>
</html>
